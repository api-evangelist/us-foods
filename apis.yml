description: >-
  US Foods is one of the largest foodservice distributors in the United States,
  serving restaurants, healthcare facilities, hospitality businesses, government
  institutions, and educational facilities. As a Fortune 500 company, US Foods
  operates a national distribution network with over 70 distribution centers
  and serves approximately 250,000 customers. The company's digital platform
  includes the MOXe eCommerce application for ordering and business management,
  EDI integration for B2B transactions, and a supplier PIM system for product
  data synchronization. US Foods has undergone significant digital transformation
  building a data mesh architecture on Apache Kafka, MongoDB, and cloud platforms
  to support its eCommerce and supply chain operations.
